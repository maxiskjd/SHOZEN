name: SHOZEN

on:
  schedule:
    # cada 15 min, entre 11:00 y 04:00 UTC (cubre 8:00-23:00 hora de Chile
    # con margen para el cambio de horario de verano; el script mismo
    # vuelve a chequear la hora exacta y no hace nada fuera de rango).
    # Minutos 7/22/37/52 y no 0/15/30/45: GitHub retrasa o salta las
    # ejecuciones en los cuartos de hora, que es cuando mas carga tiene.
    - cron: "7,22,37,52 11-23,0-4 * * *"
  workflow_dispatch: {}  # permite correrlo a mano desde la pestaña Actions

permissions:
  contents: write

concurrency:
  group: shozen
  cancel-in-progress: false

jobs:
  shozen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Correr SHOZEN
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python shozen.py

      - name: Guardar estado actualizado
        run: |
          git config user.name "shozen-bot"
          git config user.email "actions@github.com"
          git add shozen_estado.json shozen_log.txt
          git diff --staged --quiet || git commit -m "Actualiza estado de SHOZEN [skip ci]"
          git push
