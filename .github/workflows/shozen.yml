name: SHOZEN

on:
  # Lo activa cron-job.org (tarea "SHOZEN") cada 15 min de 8:00 a 22:45 hora
  # de Chile, con un POST a la API de GitHub (workflow_dispatch). Se dejo de
  # usar "schedule" porque GitHub saltaba ejecuciones (habia horas sin correr).
  # Tambien se puede correr a mano desde la pestaña Actions.
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: shozen
  cancel-in-progress: false

jobs:
  shozen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Correr SHOZEN
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python shozen.py

      - name: Guardar estado actualizado
        run: |
          git config user.name "shozen-bot"
          git config user.email "actions@github.com"
          git add shozen_estado.json shozen_log.txt
          git diff --staged --quiet || git commit -m "Actualiza estado de SHOZEN [skip ci]"
          git push
